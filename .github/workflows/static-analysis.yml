name: CodeQL

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'c-cpp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update build environment
        run: sudo apt-get update --fix-missing -y -o Acquire::Retries=3

      # cups-browsed's own build dependencies against distro CUPS 2.4:
      # cups-config (libcups2-dev), libcupsfilters, libppd, glib/gio and avahi.
      # No source-CUPS build is needed here - static analysis only needs one
      # clean build of cups-browsed itself to scan.
      - name: Install prerequisites
        run: |
          sudo apt-get install -y -o Acquire::Retries=3 \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            gettext \
            autopoint \
            libcups2-dev \
            libcupsfilters-dev \
            libppd-dev \
            libglib2.0-dev \
            libavahi-client-dev \
            libavahi-common-dev \
            libavahi-glib-dev

      - name: Generate configure script
        run: ./autogen.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
